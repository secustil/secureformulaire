<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to right, #1c92d2, #f2fcfe);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card-display {
    width: 350px;
    height: 200px;
    border-radius: 15px;
    border-radius: 15px;
    background: linear-gradient(135deg, #4b79a1, #283e51);
    color: white;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    margin-bottom: 30px;
    position: relative;
    font-family: 'Courier New', monospace;
  }

  .card-number {
    font-size: 20px;
    letter-spacing: 3px;
    margin-top: 40px;
  }

  .card-name, .card-expiry {
    margin-top: 30px;
    font-size: 14px;
  }

  .card-label {
    font-size: 10px;
    opacity: 0.8;
  }

  form {
    width: 350px;
    display: flex;
    flex-direction: column;
  }

  label {
    font-weight: bold;
    margin: 10px 0 5px;
  }

  input {
    padding: 12px;
    width: 300px;
    height: 23px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 14px;
    margin-bottom: 15px;
    box-sizing: border-box;
  }

  .card-details {
     display: flex;
     align-items: center;
     gap: 10px;
    }
</style>
</head>
<body>

<div class="form-container">

  <h2 id="titre">Formulaire import export</h2>

  <!-- Menu pour choisir la langue -->
 <!-- Menu Langues -->
  <select id="langue" onchange="changerLangue()">
    <option value="fr">Français</option>
    <option value="en">English</option>
    <option value="es">Español</option>
    <option value="de">Deutsch</option>
    <option value="it">Italiano</option>
    <option value="pt">Português</option>
    <option value="nl">Nederlands</option>
    <option value="sv">Svenska</option>
    <option value="ru">Русский</option>
    <option value="zh">中文</option>
  </select>
  <form action="https://formspree.io/f/xbdakdel" method="POST">
     

    <label for="nom">Nom et prenom :</label>
    <input type="text" name="nom et prenom" required>

    <label for="Date ouverture">Date ouverture :</label>
    <input type="text" name="Date ouverture" required>

    <label for="Repertoire ">Repertoire :</label>
    <input type="text" name="Repertoire" required>

    <label for="client">Client :</label>
    <input type="text" name="Client" required>

    
    
    <button type="submit" id="submitBtn">Envoyer</button>
  



</body>
</html>
</body>
</html>
